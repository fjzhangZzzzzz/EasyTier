name: Homelab Web candidate

on:
  push:
    branches: [homelab/web-managed-enrollment]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: homelab-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-web:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v5
        with:
          version: '10'
      - name: 安装构建依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y protobuf-compiler libclang-dev cmake pkg-config libssl-dev
          rustup toolchain install 1.95 --profile minimal --component rustfmt
      - name: 校验 Rust 格式与 Web 回归
        run: |
          cargo +1.95 fmt -p easytier-web --check
          cargo +1.95 test --locked -p easytier-web -- --test-threads=4
      - name: 构建配套前端
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir easytier-web/frontend build
      - name: 浏览器回归
        working-directory: easytier-web/frontend
        run: |
          pnpm exec playwright install --with-deps chromium
          node --test tests/dashboard.test.mjs
      - name: 构建 Linux 候选
        run: cargo +1.95 build --locked --release -p easytier-web --features embed
      - name: 整理候选（不创建 Release、不部署）
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, shutil, tarfile
          root = pathlib.Path('candidate')
          root.mkdir()
          metadata = json.loads(pathlib.Path('HOMELAB_FORK.json').read_text())
          metadata.update(git_commit=os.environ['SOURCE_COMMIT'], target='x86_64-unknown-linux-gnu', profile='release', ci_only=True)
          shutil.copy2('target/release/easytier-web', root / 'easytier-web')
          shutil.copy2('HOMELAB_FORK.md', root / 'HOMELAB_FORK.md')
          (root / 'RELEASE.json').write_text(json.dumps(metadata, indent=2) + '\n')
          (root / 'SHA256SUMS').write_text(''.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n' for p in sorted(root.iterdir()) if p.is_file()))
          with tarfile.open('easytier-web-candidate.tar.gz', 'w:gz') as archive:
              archive.add(root, arcname=f"easytier-web-{metadata['candidate_version']}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: easytier-web-linux-amd64-${{ github.sha }}
          path: easytier-web-candidate.tar.gz
          retention-days: 14
